  highlights:
  - We’ve launched a new set of metrics that help quantify how collaboration across time zones impacts teams—giving distributed organizations
    clearer visibility into coordination challenges and opportunities.
  - Greater time zone separation and limited workday overlap indicate employees must coordinate across multiple time zones, slowing peer feedback
    loops and increasing the overhead of scheduling meetings.
  - This can **extend decision cycles**, since questions and approvals often sit idle for an entire day before the right people are online, and
    it **raises the risk of context loss and miscommunication**.
  version: 2025-12
- breaking: false
  highlights:
  - We’ve released a major upgrade to Worklytics’ permissions framework, giving you far greater control over who sees which analytics across your
    organization.
  - This update introduces fully customizable roles that let administrators determine exactly which dashboards are visible to each user group.
  - To support larger rollouts, this release also integrates Worklytics roles with SAML-based single sign-on providers such as Okta.
  version: 2025-10
